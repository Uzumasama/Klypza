[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
PADDLE_ENV = "sandbox"
PADDLE_STANDARD_PRICE_ID = "pri_01m74g6gh3pe7j1p6hyzwfg3se"
