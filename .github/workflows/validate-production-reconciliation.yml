name: Validate production reconciliation branch

on:
  push:
    branches:
      - integration/production-worker-reconciliation
      - fix/production-readiness-2026-11-20
  pull_request:
    branches:
      - integration/production-worker-reconciliation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Check Worker JavaScript syntax
        run: node --check cloudflare/worker.mjs
      - name: Check backup script syntax
        run: bash -n scripts/backup-d1.sh
      - name: Validate Wrangler configuration and build
        run: npx --yes wrangler@4.162.0 deploy --dry-run --outdir /tmp/klypza-dry-run
