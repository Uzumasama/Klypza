name: Klypza Lighthouse audit

on:
  workflow_run:
    workflows: ["Deploy Klypza to Cloudflare Workers"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

concurrency:
  group: klypza-lighthouse-audit
  cancel-in-progress: false

jobs:
  lighthouse:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Audit production pages
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://klypza.web.id/
            https://klypza.web.id/about
            https://klypza.web.id/privacy-policy
            https://klypza.web.id/terms
          runs: 1
          uploadArtifacts: true
