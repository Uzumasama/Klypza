name: Validate Klypza production candidate

on:
  push:
    branches:
      - production/klypza-main-reconciliation
      - fix/production-dashboard-full-width-menu
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Validate Worker JavaScript syntax
        run: node --check cloudflare/worker.mjs
      - name: Validate browser test syntax
        run: node --check tests/e2e/public-site.spec.js
      - name: Validate production plan and payment safeguards
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('cloudflare/worker.mjs', 'utf8');
          const required = [
            /free:\s*\{\s*daily:\s*10,\s*batch:\s*5,\s*price:\s*0/,
            /standard:\s*\{\s*daily:\s*60,\s*batch:\s*15,\s*price:\s*5\.99/,
            /premium:\s*\{\s*daily:\s*100,\s*batch:\s*25,\s*price:\s*9\.99/,
            /PADDLE_LIVE_API_KEY/,
            /PADDLE_LIVE_CLIENT_TOKEN/,
            /PADDLE_LIVE_WEBHOOK_SECRET/,
            /PADDLE_STANDARD_PRICE_ID/,
            /PADDLE_PREMIUM_PRICE_ID/,
            /handleDownloadComplete/,
            /createPendingDownload/
          ];
          for (const pattern of required) {
            if (!pattern.test(source)) throw new Error('Missing required production feature: ' + pattern);
          }
          if (source.includes('nap5k.com/tag.min.js') || source.includes('3nbf4.com') || source.includes('12250376')) throw new Error('Legacy floating Monetag script/service worker must remain disabled.');
          if (source.includes("Paddle.Environment.set('sandbox')")) throw new Error('Paddle.js must use the configured environment.');
          console.log('Production plan, Paddle gating, and existing download-confirmation flow checks passed.');
          NODE
      - name: Verify production dashboard menu layout overrides legacy sidebar rules
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('cloudflare/worker.mjs', 'utf8');
          const marker = 'Active Dashboard stylesheet: final production navigation and route visibility override';
          const markerAt = source.lastIndexOf(marker);
          const styleMarker = '<style id=\\"klypza-history-polish\\">';
          const styleStart = source.lastIndexOf(styleMarker, markerAt);
          const styleEnd = source.indexOf('</style>', markerAt);
          const dashboardMarkup = source.indexOf('id=\\"dashboardCard\\"');
          if (markerAt < 0 || styleStart < 0 || styleEnd < markerAt || dashboardMarkup < 0 || dashboardMarkup > styleStart) {
            throw new Error('Production dashboard override is not in the active late-loaded dashboard stylesheet.');
          }
          const css = source.slice(styleStart, styleEnd);
          if (!source.includes("document.body.classList.add('klypza-dashboard-route')")) throw new Error('Dashboard route visibility guard is missing.');
          const required = [
            '#dashboardCard{display:none!important;grid-template-columns:minmax(0,1fr)!important',
            'body.klypza-dashboard-route #dashboardCard{display:grid!important',
            'body.klypza-dashboard-route #dashboardCard{display:block!important',
            '#dashboardCard>.dashboard-side-menu{display:block!important;justify-self:stretch!important;align-self:stretch!important;width:100%!important;max-width:none!important',
            'grid-template-columns:repeat(4,minmax(0,1fr))!important',
            '@media(max-width:620px)'
          ];
          for (const text of required) {
            if (!css.includes(text)) throw new Error('Missing required dashboard layout override: ' + text);
          }
          const finalRules = css.slice(css.indexOf(marker));
          if (finalRules.includes('width:min(100%,320px)!important')) {
            throw new Error('Legacy 320px menu width remains after the final override.');
          }
          console.log('Full-width dashboard menu overrides and responsive rules verified.');
          NODE
      - name: Install browser test dependencies
        run: npm install --no-save --no-package-lock @playwright/test
      - name: Install Chromium for dashboard browser test
        run: npx playwright install --with-deps chromium
      - name: Start local production-candidate Worker
        run: |
          (npx --yes wrangler@4.162.0 dev --local --port 8787 --ip 127.0.0.1 > /tmp/klypza-worker-preview.log 2>&1 & echo $! > /tmp/klypza-worker-preview.pid)
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/ > /dev/null; then
              echo "Local Worker preview is responding."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/klypza-worker-preview.log
          exit 1
      - name: Run dashboard responsive layout browser test
        env:
          BASE_URL: http://127.0.0.1:8787
        run: npx playwright test -g "dashboard menu is full-width above content on desktop, tablet, and mobile" --project=chromium
      - name: Validate Wrangler production build without deploying
        run: npx --yes wrangler@4.162.0 deploy --dry-run --outdir /tmp/klypza-production-candidate
