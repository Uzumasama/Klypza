name: Deploy Klypza staging Worker

on:
  push:
    branches:
      - design/dashboard-profile-refinement
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klypza-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/design/dashboard-profile-refinement'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
      - name: Verify Cloudflare token is available
        env:
          CLOUDFLARE_STAGING_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_STAGING_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_STAGING_API_TOKEN is missing or unavailable."
            exit 1
          fi
          echo "Cloudflare API token is available; value is hidden."
      - name: Verify Resend staging secret is available
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::error::RESEND_API_KEY is missing from the staging environment."
            exit 1
          fi
          echo "Resend API key is available; value is hidden."
      - name: Apply Resend secret to staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          printf '%s' "$RESEND_API_KEY" | npx --yes wrangler@4.162.0 secret put RESEND_API_KEY --config wrangler.staging.toml
      - name: Apply optional SaveAPI secret to staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          SAVEAPI_KEY: ${{ secrets.SAVEAPI_KEY }}
        run: |
          if [ -n "$SAVEAPI_KEY" ]; then
            printf '%s' "$SAVEAPI_KEY" | npx --yes wrangler@4.162.0 secret put SAVEAPI_KEY --config wrangler.staging.toml
            echo "SaveAPI secret applied to staging Worker; value is hidden."
          else
            echo "SAVEAPI_KEY is not configured in staging; video processing remains disabled."
          fi
      - name: Validate Worker JavaScript syntax
        run: node --check cloudflare/worker.mjs
      - name: Deploy isolated staging Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          wranglerVersion: "4.162.0"
          command: deploy --config wrangler.staging.toml
      - name: Smoke-test staging routes and plan catalog
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://klypza-staging.cokso344.workers.dev';
          for (const path of ['/', '/plans', '/login', '/register']) {
            const response = await fetch(base + path);
            if (!response.ok) throw new Error(path + ' returned HTTP ' + response.status);
          }
          const response = await fetch(base + '/api/plans', { headers: { accept: 'application/json' } });
          if (!response.ok) throw new Error('/api/plans returned HTTP ' + response.status);
          const data = await response.json();
          const expected = { free: [0, 10, 5], standard: [5.99, 60, 15], premium: [9.99, 100, 25] };
          for (const [id, values] of Object.entries(expected)) {
            const plan = data.plans?.find(item => item.id === id);
            if (!plan || plan.price !== values[0] || plan.dailyLimit !== values[1] || plan.batchLimit !== values[2]) {
              throw new Error('Unexpected plan catalog values for ' + id + ': ' + JSON.stringify(plan));
            }
          }
          console.log('Staging routes and plan catalog passed.');
          NODE
