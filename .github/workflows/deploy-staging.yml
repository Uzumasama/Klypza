name: Deploy Klypza staging candidate

on:
  push:
    branches:
      - fix/production-readiness-2026-11-20
    paths:
      - "cloudflare/**"
      - "wrangler.staging.toml"
      - ".github/workflows/deploy-staging.yml"
      - "tests/**"
      - "package.json"
      - "playwright.config.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klypza-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/fix/production-readiness-2026-11-20'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Verify Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi
      - name: Deploy isolated staging Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.162.0"
          command: deploy --config wrangler.staging.toml

  browser-tests:
    needs: deploy
    if: github.ref == 'refs/heads/fix/production-readiness-2026-11-20'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run staging browser tests
        run: npm run test:e2e
        env:
          BASE_URL: https://klypza-staging.cokso344.workers.dev
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klypza-staging-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
