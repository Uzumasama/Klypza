name: Deploy Klypza staging Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klypza-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/design/dashboard-profile-refinement'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
      - name: Verify Cloudflare token is available
        env:
          CLOUDFLARE_STAGING_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_STAGING_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_STAGING_API_TOKEN is missing or unavailable."
            exit 1
          fi
          echo "Cloudflare API token is available; value is hidden."
      - name: Verify isolated staging service secrets
        env:
          SAVEAPI_KEY: ${{ secrets.SAVEAPI_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
          PADDLE_CLIENT_TOKEN: ${{ secrets.PADDLE_CLIENT_TOKEN }}
          PADDLE_WEBHOOK_SECRET: ${{ secrets.PADDLE_WEBHOOK_SECRET }}
        run: |
          missing=0
          for key in SAVEAPI_KEY RESEND_API_KEY PADDLE_API_KEY PADDLE_CLIENT_TOKEN PADDLE_WEBHOOK_SECRET; do
            if [ -z "${!key}" ]; then
              echo "::error::Required staging secret $key is missing."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "All required staging service secrets are present; values remain hidden."
      - name: Deploy isolated staging Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          wranglerVersion: "4.162.0"
          command: deploy --config wrangler.staging.toml
