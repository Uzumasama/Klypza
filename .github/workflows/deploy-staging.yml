name: Deploy Klypza staging Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klypza-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/design/dashboard-profile-refinement'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
      - name: Verify Cloudflare token is available
        env:
          CLOUDFLARE_STAGING_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_STAGING_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_STAGING_API_TOKEN is missing or unavailable."
            exit 1
          fi
          echo "Cloudflare API token is available; value is hidden."
      - name: Verify Resend staging secret is available
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::error::RESEND_API_KEY is missing from the staging environment."
            exit 1
          fi
          echo "Resend API key is available; value is hidden."
      - name: Apply Resend secret to staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          printf '%s' "$RESEND_API_KEY" | npx --yes wrangler@4.162.0 secret put RESEND_API_KEY --config wrangler.staging.toml
      - name: Validate Worker JavaScript syntax
        run: node --check cloudflare/worker.mjs
      - name: Deploy isolated staging Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          wranglerVersion: "4.162.0"
          command: deploy --config wrangler.staging.toml
